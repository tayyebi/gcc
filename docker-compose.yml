name: gcc

services:
  hugo:
    # Base image only — project files are NOT baked into the image,
    # they are mounted from the host at runtime (see volumes below).
    # Community Hugo extended image, pinned to the same version used in CI (0.147.0).
    # Alternative official image: ghcr.io/gohugoio/hugo:v0.147.0 (extended by default)
    image: hugomods/hugo:exts-0.147.0
    container_name: gcc-hugo
    working_dir: /src
    command: >
      server
      --bind 0.0.0.0
      --port 1313
      --baseURL https://www.globalcommercecouncil.com/
      --appendPort=false
      --buildDrafts
      --buildFuture
      --disableFastRender
    ports:
      # Host:Container — bind Hugo (1313 inside) to 8019 on the server/host
      # Reverse proxy (nginx/caddy/traefik) should forward https://www.globalcommercecouncil.com → host:8019
      - "8019:1313"
    volumes:
      # Mount the entire project from host (live reload, no COPY in Dockerfile)
      - ./:/src
      # Optional: persist Hugo cache / modules between restarts (improves rebuild speed)
      # Uncomment if you use Hugo Modules:
      # - hugo_cache:/tmp/hugo_cache
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
      HUGO_ENVIRONMENT: production
      TZ: UTC
    restart: unless-stopped
    stdin_open: true
    tty: true

# Uncomment if you enable the hugo_cache volume above
#volumes:
#  hugo_cache:
